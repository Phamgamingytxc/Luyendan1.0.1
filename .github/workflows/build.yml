name: Build DanDao
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Giai nen source
        run: unzip -oq DanDao-SOURCE-CongThucMenu.zip
      - name: Build
        run: mvn -B clean package
        working-directory: DanDao
      - uses: actions/upload-artifact@v4
        with:
          name: DanDao-jar
          path: DanDao/target/*.jar
